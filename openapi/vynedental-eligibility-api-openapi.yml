  /eligibility-status/{onederfulId}:
    get:
      parameters:
      - schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        in: path
        name: onederfulId
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    enum:
                    - 200
                  error:
                    type: string
                    nullable: true
                    enum:
                    - null
                  message:
                    type: string
                    enum:
                    - History retrieved successfully
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        requestId:
                          type: string
                        status:
                          type: string
                          enum:
                          - callback_completed
                          - callback_failed
                          - completed
                          - failed
                          - queued
                          - processing
                          - requeued
                          - response_requested
                          - response_returned
                          - response_failed
                          - response_unavailable
                        createdAt:
                          type: string
                          format: date-time
                        metadata:
                          nullable: true
                      required:
                      - requestId
                      - status
                      - createdAt
                      additionalProperties: false
                required:
                - statusCode
                - error
                - message
                - history
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - Unauthorized request
                  message:
                    type: string
                    enum:
                    - User is unauthorized to view this request
                required:
                - error
                - message
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - Invalid request
                  message:
                    type: string
                    enum:
                    - Request could not be located
                required:
                - error
                - message
                additionalProperties: false
  /edi/eligibility:
    post:
      summary: Synchronous EDI eligibility check
      tags:
      - EDI
      description: Accepts an X12 EDI 270 eligibility inquiry and returns an X12 EDI 271 eligibility response synchronously. On parse failure, returns an X12 EDI 999 Functional Acknowledgement. Authentication and authorization failures return the HTTP status code only with no response body. Requires feature:eligibility scope.
      requestBody:
        content:
          application/edi-x12:
            schema:
              type: string
              description: X12 EDI 270 eligibility inquiry
        description: X12 EDI 270 eligibility inquiry
      security:
      - BearerAuth: []
      responses:
        '200':
          description: X12 EDI 271 eligibility response or 999 Functional Acknowledgement
          content:
            application/edi-x12:
              schema:
                type: string
                description: X12 EDI 271 eligibility response or 999 Functional Acknowledgement
          headers:
            X-Onederful-Id:
              description: Onederful request ID for this EDI transaction
              schema:
                type: string
                format: uuid
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  onederfulId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  code:
                    type: string
                  message:
                    type: string
                  primaryReason:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties: false
                  status_code:
                    nullable: true
                    type: string
                  status_description:
                    nullable: true
                    type: string
                required:
                - onederfulId
                - code
                - message
                - primaryReason
                - errors
                additionalProperties: false
        '401':
          description: Unauthorized — no response body
        '403':
          description: Forbidden — no response body
        '415':
          description: Content-Type must be application/edi-x12
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                - message
                additionalProperties: false
                description: Content-Type must be application/edi-x12
