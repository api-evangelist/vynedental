openapi: 3.0.0
info:
  title: Vyne Dental Eligibility and Benefits API (Onederful)
  version: 1.0.0
  x-original-title: API Documentation
  x-provenance:
    generated: '2026-10-13'
    method: searched
    source: https://production.onederful.co/swagger.json
    note: 'Saved verbatim from the Swagger UI at production.onederful.co/api-docs/; only info.title and servers[] were added (the original servers[] is empty; both hosts are named in Vyne''s own API reference). Ownership: Onederful is Vyne Dental''s eligibility and benefits API -- vynedental.com/onederful/ redirects to vynedental.com/api-eligibility-benefits/, which links the Vyne API Documentation Portal at developers.onederful.co.'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProcedureCodeTypeInput:
      type: string
      minLength: 5
      maxLength: 5
      pattern: ^D.*
    CoverageStatusEnumInput:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - NOT_FOUND
      - TERMINATED
      - UNKNOWN
    ClearCoverageStructureEnumInput:
      type: string
      enum:
      - CLEAR_COVERAGE_V1
      - CLEAR_COVERAGE_V2
    DentalClassificationEnumInput:
      type: string
      enum:
      - BASIC
      - MAJOR
      - ORTHO
      - PREVENTIVE
    GenderEnumInput:
      type: string
      enum:
      - FEMALE
      - MALE
      - UNKNOWN
    NetworkEnumInput:
      type: string
      enum:
      - IN_NETWORK
      - OUT_OF_NETWORK
    NetworkQualifierEnumInput:
      type: string
      enum:
      - PPO
      - PREMIER
    OrthodonticRecurringPaymentFrequencyEnumInput:
      type: string
      enum:
      - ANNUALLY
      - MONTHLY
      - QUARTERLY
      - SEMI_ANNUALLY
      - UNKNOWN
    PlanTypeEnumInput:
      type: string
      enum:
      - GOV
      - HMO
      - IDM
      - POS
      - PPO
      - GROUP_POLICY
      - UKN
    PolicyPeriodEnumInput:
      type: string
      enum:
      - CALENDAR
      - PLAN
    RelationshipEnumInput:
      type: string
      enum:
      - CHILD
      - DEPENDENT
      - SELF
      - SPOUSE
      - UNKNOWN
    SourceIndicatorEnumInput:
      type: string
      enum:
      - BY_CATEGORY
      - BY_CATEGORY_CODES
      - BY_PROCEDURE_CODE
    SeatPrepEnumInput:
      type: string
      enum:
      - PREP
      - SEAT
      - UNKNOWN
    YesNoEnumInput:
      type: string
      enum:
      - 'NO'
      - 'YES'
    AddressTypeInput:
      type: object
      properties:
        city:
          nullable: true
          type: string
        state:
          nullable: true
          type: string
        street:
          nullable: true
          type: string
        zip:
          nullable: true
          type: string
      required:
      - city
      - state
      - street
      - zip
    BaseLimitationComponentTypeInput:
      type: object
      properties:
        quantity:
          type: string
        quantity_qualifier:
          type: string
      additionalProperties: false
    FrequencyComponentTypeInput:
      type: object
      properties:
