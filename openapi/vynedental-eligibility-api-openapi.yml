  /async/edi/eligibility:
    post:
      summary: Asynchronous EDI eligibility check
      tags:
      - EDI
      description: Accepts an X12 EDI 270 eligibility inquiry and enqueues it for processing. Returns HTTP 202 with the request ID in X-Onederful-Id on success. On parse failure, returns an X12 EDI 999 Functional Acknowledgement synchronously. Supply X-Callback-Url to receive the 271 response at a webhook. Authentication and authorization failures return the HTTP status code only with no response body. Requires feature:edi-eligibility scope.
      requestBody:
        content:
          application/edi-x12:
            schema:
              type: string
              description: X12 EDI 270 eligibility inquiry
        description: X12 EDI 270 eligibility inquiry
      parameters:
      - schema:
          type: string
          format: uri
        in: header
        name: x-callback-url
        required: false
      security:
      - BearerAuth: []
      responses:
        '200':
          description: X12 EDI 999 Functional Acknowledgement — returned synchronously on parse failure
          content:
            application/edi-x12:
              schema:
                type: string
                description: X12 EDI 999 Functional Acknowledgement — returned synchronously on parse failure
          headers:
            X-Onederful-Id:
              description: Onederful request ID for this EDI transaction
              schema:
                type: string
                format: uuid
        '202':
          description: Accepted — request enqueued for processing. No response body.
          headers:
            X-Onederful-Id:
              description: Onederful request ID for this EDI transaction
              schema:
                type: string
                format: uuid
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  onederfulId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  code:
                    type: string
                  message:
                    type: string
                  primaryReason:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties: false
                  status_code:
                    nullable: true
                    type: string
                  status_description:
                    nullable: true
                    type: string
                required:
                - onederfulId
                - code
                - message
                - primaryReason
                - errors
                additionalProperties: false
        '401':
          description: Unauthorized — no response body
        '403':
          description: Forbidden — no response body
        '415':
          description: Content-Type must be application/edi-x12
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                - error
                - message
                additionalProperties: false
                description: Content-Type must be application/edi-x12
