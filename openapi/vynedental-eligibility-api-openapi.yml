      - schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        in: path
        name: onederfulId
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          description: X12 EDI 271 eligibility response
          content:
            application/edi-x12:
              schema:
                type: string
                description: X12 EDI 271 eligibility response
          headers:
            X-Onederful-Id:
              description: Onederful request ID for this EDI transaction
              schema:
                type: string
                format: uuid
        '202':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  onederfulId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  message:
                    type: string
                    enum:
                    - Response is not ready
                required:
                - onederfulId
                - message
                additionalProperties: false
        '401':
          description: Unauthorized — no response body
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - Unauthorized request
                  message:
                    type: string
                required:
                - error
                - message
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
