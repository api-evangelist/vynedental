                          maxLength: 10
                        tax_id:
                          type: string
                          minLength: 9
                          maxLength: 9
                        network:
                          type: string
                        payer_specific_description:
                          type: string
                        gender:
                          type: string
                          enum:
                          - M
                          - F
                          - U
                        first_name:
                          type: string
                        last_name:
                          type: string
                        address_line_one:
                          type: string
                        address_line_two:
                          type:
                          - string
                          - 'null'
                        city:
                          type: string
                        state:
                          type: string
                        zip_code:
                          type: string
                      required:
                      - npi
                    payer:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        address_line_one:
                          type: string
                        address_line_two:
                          type:
                          - string
                          - 'null'
                        city:
                          type: string
                        state:
                          type: string
                        zip_code:
                          type: string
                      required:
                      - id
                    procedure_codes:
                      type: array
                      items:
                        type: string
                    version:
                      type: string
                    location_id:
                      type: string
                    options:
                      type: object
                      properties:
                        status_classifier:
                          type: boolean
                      required:
                      - status_classifier
                    response_structure:
                      allOf:
                      - $ref: '#/components/schemas/ClearCoverageStructureEnumInput'
                    subscriber:
                      type: object
                      properties:
                        first_name:
                          type: string
                        last_name:
                          type: string
                        gender:
                          allOf:
                          - $ref: '#/components/schemas/GenderEnumInput'
                        group_number:
                          type: string
                        address_line_one:
                          type: string
                        address_line_two:
                          type:
                          - string
                          - 'null'
                        city:
                          type: string
                        state:
                          type: string
                        zip_code:
                          type: string
                        dob:
                          type: string
                        member_id:
                          type: string
