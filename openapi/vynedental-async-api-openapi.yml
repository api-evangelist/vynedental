  /async/eligibility/sequenced-search:
    post:
      summary: Asynchronous eligibility check (Sequenced Alternate Member Searching)
      description: Enqueues an eligibility request and, when the payer rejects it as "member not found", automatically retries using that payer's configured sequence of alternate member-data subsets before failing the transaction. Every attempt is recorded in a retry_details array on the response retrieved via GET /eligibility-response/{onederfulId}. Because each retry is an additional round-trip to the payer, a request on this endpoint can take considerably longer to complete than one on /async/eligibility. Requires feature:sequenced-search scope.
