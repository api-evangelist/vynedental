                      - dob
                    dependent:
                      type:
                      - string
                      - 'null'
                      enum:
                      - null
                  required:
                  - provider
                  - payer
                  - subscriber
                - type: object
                  properties:
                    provider:
                      type: object
                      properties:
                        npi:
                          type: string
                          minLength: 10
                          maxLength: 10
