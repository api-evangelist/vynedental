openapi: 3.2.0
info:
  title: Documentation Eligibility Response API
  version: 1.0.0
servers: []
tags:
- name: Eligibility Response
paths:
  /eligibility-response/{onederfulId}:
    get:
      parameters:
      - schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        in: path
        name: onederfulId
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    active_coverage:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBGenericBenefitType'
                    benefit_computed:
                      allOf:
                      - $ref: '#/components/schemas/EBBenefitComputedType'
                    coinsurance:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBGenericBenefitType'
                    coinsurance_computed:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBGenericBenefitType'
                    copayment:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBGenericBenefitType'
                    coverage:
                      allOf:
                      - $ref: '#/components/schemas/EBCoverageType'
                    deductible:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBGenericBenefitType'
                    deductible_computed:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBBenefitAmountRemaining'
                    dependents:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBPatientType'
                    disclaimers:
                      type: array
                      items:
                        type: string
                    effective_dates:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBEffectivePeriod'
                    limitations:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBGenericBenefitType'
                    maximum_computed:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBBenefitAmountRemaining'
                    maximums:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBGenericBenefitType'
                    metadata:
                      allOf:
                      - $ref: '#/components/schemas/EBMetadataType'
                    network_options_computed:
                      type: array
                      items:
                        type: string
                    not_covered:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBGenericBenefitType'
                    onederfulId:
                      type: string
                    out_of_pocket:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBGenericBenefitType'
                    patient:
                      allOf:
                      - $ref: '#/components/schemas/EBPatientType'
                    patient_computed:
                      allOf:
                      - $ref: '#/components/schemas/EBPatientType'
                    payer:
                      allOf:
                      - $ref: '#/components/schemas/EBPayerType'
                    payer_specific_info:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBGenericBenefitType'
                    payer_uuid:
                      type: string
                    plan:
                      allOf:
                      - $ref: '#/components/schemas/EBPlanType'
                    procedure_code_computed:
                      allOf:
                      - $ref: '#/components/schemas/EBProcedureCodeComputedType'
                    procedure_code_list_computed:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBProcedureCodeComputedType'
                    provider:
                      allOf:
                      - $ref: '#/components/schemas/EBProviderType'
                    subscriber:
                      allOf:
                      - $ref: '#/components/schemas/EBPatientType'
                    waiting_period:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBGenericBenefitType'
                    retry_details:
                      type: array
                      items:
                        $ref: '#/components/schemas/EBRetryDetailType'
                  additionalProperties: false
                - type: object
                  properties:
                    benefits:
                      type: array
                      items:
                        $ref: '#/components/schemas/BenefitType'
                    conditional_disclaimers:
                      type: array
                      items:
                        type: string
                    empty_networks:
                      type: array
                      items:
                        anyOf:
                        - $ref: '#/components/schemas/NetworkEnum'
                        - $ref: '#/components/schemas/NetworkQualifierEnum'
                    onederfulId:
                      type:
                      - string
                      - 'null'
                    provider:
                      allOf:
                      - $ref: '#/components/schemas/ProviderType'
                    patient:
                      $ref: '#/components/schemas/PatientType'
                    payer:
                      $ref: '#/components/schemas/PayerType'
                    payer_transaction_id:
                      type:
                      - string
                      - 'null'
                    plan:
                      $ref: '#/components/schemas/PlanType'
                    request_id:
                      type:
                      - string
                      - 'null'
                    response_id:
                      type:
                      - string
                      - 'null'
                    response_structure:
                      allOf:
                      - $ref: '#/components/schemas/ClearCoverageStructureEnum'
                    rules:
                      $ref: '#/components/schemas/RulesType'
                    subscriber:
                      $ref: '#/components/schemas/PatientType'
                  required:
                  - benefits
                  - conditional_disclaimers
                  - empty_networks
                  - onederfulId
                  - provider
                  - patient
                  - payer
                  - payer_transaction_id
                  - plan
                  - request_id
                  - response_id
                  - rules
                  - subscriber
                  additionalProperties: false
                - type: object
                  properties:
                    onederfulId:
                      type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    code:
                      type: string
                    message:
                      type: string
                    primaryReason:
                      type: string
                    errors:
                      type: array
                      items:
                        type: object
                        properties: {}
                        additionalProperties: false
                    status_code:
                      type:
                      - string
                      - 'null'
                    status_description:
                      type:
                      - string
                      - 'null'
                  required:
                  - onederfulId
                  - code
                  - message
                  - primaryReason
                  - errors
                  additionalProperties: false
                - type: object
                  properties:
                    onederfulId:
                      type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    statusCode:
                      type: number
                      enum:
                      - 200
                    error:
                      type:
                      - string
                      - 'null'
                      enum:
                      - null
                    message:
                      anyOf:
                      - type: string
                        enum:
                        - Response is not ready
                      - type: string
                        enum:
                        - Response unavailable
                      - type: string
                        enum:
                        - Response only available in EDI format.
                  required:
                  - onederfulId
                  - statusCode
                  - error
                  - message
                  additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - Unauthorized request
                  message:
                    type: string
                    enum:
                    - User is unauthorized to view this request
                required:
                - error
                - message
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - Invalid request
                  message:
                    type: string
                    enum:
                    - Request could not be located
                required:
                - error
                - message
                additionalProperties: false
      tags:
      - Eligibility Response
      summary: Get eligibility response by onederful id
      x-summary-source: derived
      operationId: getEligibilityResponseByOnederfulId
      x-operation-id-source: derived
  /eligibility-response/{onederfulId}/html:
    get:
      parameters:
      - schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        in: path
        name: onederfulId
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    enum:
                    - 200
                  error:
                    type:
                    - string
                    - 'null'
                    enum:
                    - null
                  message:
                    anyOf:
                    - type: string
                      enum:
                      - Response is not ready
                    - type: string
                      enum:
                      - Response unavailable
                    - type: string
                      enum:
                      - Response only available in EDI format.
                required:
                - statusCode
                - error
                - message
                additionalProperties: false
            text/html:
              schema:
                type: string
                format: html
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - Unauthorized request
                  message:
                    type: string
                    enum:
                    - User is unauthorized to view this request
                required:
                - error
                - message
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: string
                      enum:
                      - Invalid request
                    message:
                      type: string
                      enum:
                      - Request could not be located
                  required:
                  - error
                  - message
                  additionalProperties: false
                - type: object
                  properties:
                    error:
                      type: string
                      enum:
                      - UnsupportedFeatureException
                    message:
                      type: string
                      enum:
                      - This feature is only available for a Standard Eligibility Response.
                  required:
                  - error
                  - message
                  additionalProperties: false
      tags:
      - Eligibility Response
      summary: Get eligibility response by onederful id html
      x-summary-source: derived
      operationId: getEligibilityResponseByOnederfulIdHtml
      x-operation-id-source: derived
components:
  schemas:
    ProviderType:
      type: object
      properties:
        npi:
          type:
          - string
          - 'null'
        first_name:
          type:
          - string
          - 'null'
        last_name:
          type:
          - string
          - 'null'
        tax_id:
          type:
          - string
          - 'null'
        organization_name:
          type:
          - string
          - 'null'
      required:
      - npi
      - first_name
      - last_name
      - tax_id
      - organization_name
      additionalProperties: false
    EBRetryDetailType:
      type: object
      properties:
        strategy_code:
          type: string
        fields_used:
          type: array
          items:
            type: string
        reject_reason:
          allOf:
          - $ref: '#/components/schemas/EBRejectionReasonType'
        invalid_fields:
          type: array
          items:
            type: string
        start:
          type: string
        end:
          type: string
        skipped_duplicate_of:
          type: string
      required:
      - strategy_code
      - fields_used
      - reject_reason
      - invalid_fields
      - start
      - end
      additionalProperties: false
    PeriodonticsCoverageType:
      type: object
      properties:
        coinsurance_percentage:
          type:
          - number
          - 'null'
        deductible_applies:
          type:
          - boolean
          - 'null'
        maximum_applies:
          type:
          - boolean
          - 'null'
        non_covered_procedure_codes:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureCodeType'
        source_indicator:
          allOf:
          - $ref: '#/components/schemas/SourceIndicatorEnum'
        gingivectomy_gingivoplasty:
          $ref: '#/components/schemas/BenefitCoverageType'
        surgical_removal_granulation_tissue:
          $ref: '#/components/schemas/BenefitCoverageType'
        gingival_flap_procedures:
          $ref: '#/components/schemas/BenefitCoverageType'
        crown_lengthening_procedures:
          $ref: '#/components/schemas/BenefitCoverageType'
        osseous_surgery:
          $ref: '#/components/schemas/BenefitCoverageType'
        perio_bone_graft:
          $ref: '#/components/schemas/BenefitCoverageType'
        guided_tissue_regeneration:
          $ref: '#/components/schemas/BenefitCoverageType'
        soft_tissue_grafts:
          $ref: '#/components/schemas/BenefitCoverageType'
        autogenous_tissue_graft:
          $ref: '#/components/schemas/BenefitCoverageType'
        scaling_and_root_planing:
          $ref: '#/components/schemas/BenefitCoverageType'
        full_mouth_debridement:
          $ref: '#/components/schemas/BenefitCoverageType'
        scaling_presence_of_inflammation:
          $ref: '#/components/schemas/BenefitCoverageType'
        periodontal_maintenance:
          $ref: '#/components/schemas/BenefitCoverageType'
      required:
      - coinsurance_percentage
      - deductible_applies
      - maximum_applies
      - non_covered_procedure_codes
      - source_indicator
      - gingivectomy_gingivoplasty
      - surgical_removal_granulation_tissue
      - gingival_flap_procedures
      - crown_lengthening_procedures
      - osseous_surgery
      - perio_bone_graft
      - guided_tissue_regeneration
      - soft_tissue_grafts
      - autogenous_tissue_graft
      - scaling_and_root_planing
      - full_mouth_debridement
      - scaling_presence_of_inflammation
      - periodontal_maintenance
      additionalProperties: false
    RestorativeCoverageType:
      type: object
      properties:
        coinsurance_percentage:
          type:
          - number
          - 'null'
        deductible_applies:
          type:
          - boolean
          - 'null'
        maximum_applies:
          type:
          - boolean
          - 'null'
        non_covered_procedure_codes:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureCodeType'
        source_indicator:
          allOf:
          - $ref: '#/components/schemas/SourceIndicatorEnum'
        amalgam_fillings:
          $ref: '#/components/schemas/BenefitCoverageType'
        anterior_composite_fillings:
          $ref: '#/components/schemas/BenefitCoverageType'
        posterior_composite_fillings:
          $ref: '#/components/schemas/BenefitCoverageType'
        gold_foil_restoration:
          $ref: '#/components/schemas/BenefitCoverageType'
        porcelain_inlays:
          $ref: '#/components/schemas/BenefitCoverageType'
        metallic_inlays:
          $ref: '#/components/schemas/BenefitCoverageType'
        porcelain_onlays:
          $ref: '#/components/schemas/BenefitCoverageType'
        metallic_onlays:
          $ref: '#/components/schemas/BenefitCoverageType'
        porcelain_ceramic_veneers:
          $ref: '#/components/schemas/BenefitCoverageType'
        resin_veneers:
          $ref: '#/components/schemas/BenefitCoverageType'
        porcelain_crowns:
          $ref: '#/components/schemas/BenefitCoverageType'
        fullcast_crown:
          $ref: '#/components/schemas/BenefitCoverageType'
        recement_crown:
          $ref: '#/components/schemas/BenefitCoverageType'
        prefab_stainless_steel_crown:
          $ref: '#/components/schemas/BenefitCoverageType'
        core_buildup:
          $ref: '#/components/schemas/BenefitCoverageType'
        post_core:
          $ref: '#/components/schemas/BenefitCoverageType'
        prefab_post_core:
          $ref: '#/components/schemas/BenefitCoverageType'
        labial_veneer:
          $ref: '#/components/schemas/BenefitCoverageType'
        composite_inlays:
          $ref: '#/components/schemas/BenefitCoverageType'
        composite_onlays:
          $ref: '#/components/schemas/BenefitCoverageType'
      required:
      - coinsurance_percentage
      - deductible_applies
      - maximum_applies
      - non_covered_procedure_codes
      - source_indicator
      - amalgam_fillings
      - anterior_composite_fillings
      - posterior_composite_fillings
      - gold_foil_restoration
      - porcelain_inlays
      - metallic_inlays
      - porcelain_onlays
      - metallic_onlays
      - porcelain_ceramic_veneers
      - resin_veneers
      - porcelain_crowns
      - fullcast_crown
      - recement_crown
      - prefab_stainless_steel_crown
      - core_buildup
      - post_core
      - prefab_post_core
      - labial_veneer
      - composite_inlays
      - composite_onlays
      additionalProperties: false
    OrthodonticsCoverageType:
      type: object
      properties:
        coinsurance_percentage:
          type:
          - number
          - 'null'
        deductible_applies:
          type:
          - boolean
          - 'null'
        maximum_applies:
          type:
          - boolean
          - 'null'
        non_covered_procedure_codes:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureCodeType'
        source_indicator:
          allOf:
          - $ref: '#/components/schemas/SourceIndicatorEnum'
        limited_orthodontic_treatment:
          $ref: '#/components/schemas/BenefitCoverageType'
        comprehensive_orthodontic_treatment:
          $ref: '#/components/schemas/BenefitCoverageType'
        appliances:
          $ref: '#/components/schemas/BenefitCoverageType'
        orthodontic_evaluation:
          $ref: '#/components/schemas/BenefitCoverageType'
        periodic_orthodontic_treatment_visit:
          $ref: '#/components/schemas/BenefitCoverageType'
        periodic_orthognathic_surgery_visit:
          $ref: '#/components/schemas/BenefitCoverageType'
        orthodontic_retention:
          $ref: '#/components/schemas/BenefitCoverageType'
        orthodontic_appliance_removal_repair:
          $ref: '#/components/schemas/BenefitCoverageType'
        orthodontic_fixed_retainer_repair:
          $ref: '#/components/schemas/BenefitCoverageType'
        orthodontic_repairs:
          $ref: '#/components/schemas/BenefitCoverageType'
        orthodontic_replacement:
          $ref: '#/components/schemas/BenefitCoverageType'
      required:
      - coinsurance_percentage
      - deductible_applies
      - maximum_applies
      - non_covered_procedure_codes
      - source_indicator
      - limited_orthodontic_treatment
      - comprehensive_orthodontic_treatment
      - appliances
      - orthodontic_evaluation
      - periodic_orthodontic_treatment_visit
      - periodic_orthognathic_surgery_visit
      - orthodontic_retention
      - orthodontic_appliance_removal_repair
      - orthodontic_fixed_retainer_repair
      - orthodontic_repairs
      - orthodontic_replacement
      additionalProperties: false
    DentalClassificationEnum:
      type: string
      enum:
      - BASIC
      - MAJOR
      - ORTHO
      - PREVENTIVE
    ClearCoverageStructureEnum:
      type: string
      enum:
      - CLEAR_COVERAGE_V1
      - CLEAR_COVERAGE_V2
    ProcedureCodeType:
      type: string
      minLength: 5
      maxLength: 5
      pattern: ^D.*
    EBAgeLimit:
      type: object
      properties:
        age_high_value:
          type: string
        age_low_value:
          type: string
      additionalProperties: false
    BenefitType:
      type: object
      properties:
        network:
          $ref: '#/components/schemas/NetworkEnum'
        network_qualifier:
          allOf:
          - $ref: '#/components/schemas/NetworkQualifierEnum'
        individual_deductible:
          type:
          - number
          - 'null'
          minimum: 0
        individual_deductible_remaining:
          type:
          - number
          - 'null'
          minimum: 0
        family_deductible:
          type:
          - number
          - 'null'
          minimum: 0
        family_deductible_remaining:
          type:
          - number
          - 'null'
          minimum: 0
        individual_maximum:
          type:
          - number
          - 'null'
          minimum: 0
        individual_maximum_remaining:
          type:
          - number
          - 'null'
          minimum: 0
        family_maximum:
          type:
          - number
          - 'null'
          minimum: 0
        family_maximum_remaining:
          type:
          - number
          - 'null'
          minimum: 0
        orthodontic_deductible:
          type:
          - number
          - 'null'
          minimum: 0
        orthodontic_deductible_remaining:
          type:
          - number
          - 'null'
          minimum: 0
        orthodontic_maximum:
          type:
          - number
          - 'null'
          minimum: 0
        orthodontic_maximum_remaining:
          type:
          - number
          - 'null'
          minimum: 0
        coverages:
          $ref: '#/components/schemas/Coverages'
      required:
      - network
      - network_qualifier
      - individual_deductible
      - individual_deductible_remaining
      - family_deductible
      - family_deductible_remaining
      - individual_maximum
      - individual_maximum_remaining
      - family_maximum
      - family_maximum_remaining
      - orthodontic_deductible
      - orthodontic_deductible_remaining
      - orthodontic_maximum
      - orthodontic_maximum_remaining
      - coverages
      additionalProperties: false
    EndodonticsCoverageType:
      type: object
      properties:
        coinsurance_percentage:
          type:
          - number
          - 'null'
        deductible_applies:
          type:
          - boolean
          - 'null'
        maximum_applies:
          type:
          - boolean
          - 'null'
        non_covered_procedure_codes:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureCodeType'
        source_indicator:
          allOf:
          - $ref: '#/components/schemas/SourceIndicatorEnum'
        pulp_capping:
          $ref: '#/components/schemas/BenefitCoverageType'
        pulpotomy:
          $ref: '#/components/schemas/BenefitCoverageType'
        pulpal_therapy:
          $ref: '#/components/schemas/BenefitCoverageType'
        endo_therapy_permanent:
          $ref: '#/components/schemas/BenefitCoverageType'
        endo_therapy_special:
          $ref: '#/components/schemas/BenefitCoverageType'
        endo_retreat:
          $ref: '#/components/schemas/BenefitCoverageType'
        apex_recal:
          $ref: '#/components/schemas/BenefitCoverageType'
        pulpal_regeneration:
          $ref: '#/components/schemas/BenefitCoverageType'
        apico_surgery:
          $ref: '#/components/schemas/BenefitCoverageType'
        additional_endo:
          $ref: '#/components/schemas/BenefitCoverageType'
      required:
      - coinsurance_percentage
      - deductible_applies
      - maximum_applies
      - non_covered_procedure_codes
      - source_indicator
      - pulp_capping
      - pulpotomy
      - pulpal_therapy
      - endo_therapy_permanent
      - endo_therapy_special
      - endo_retreat
      - apex_recal
      - pulpal_regeneration
      - apico_surgery
      - additional_endo
      additionalProperties: false
    ServiceHistoryType:
      type: object
      properties:
        service_type:
          type:
          - string
          - 'null'
        procedure_code:
          allOf:
          - $ref: '#/components/schemas/ProcedureCodeType'
        service_date:
          type:
          - string
          - 'null'
          pattern: ^(0[1-9]|1[0-2])\/(0[1-9]|[12][0-9]|3[01])\/\d{4}$
        tooth:
          type:
          - string
          - 'null'
        surfaces:
          type:
          - string
          - 'null'
        area:
          type:
          - string
          - 'null'
      required:
      - procedure_code
      - service_date
      - tooth
      - surfaces
      - area
      additionalProperties: false
    NetworkEnum:
      type: string
      enum:
      - IN_NETWORK
      - OUT_OF_NETWORK
    NetworkQualifierEnum:
      type: string
      enum:
      - PPO
      - PREMIER
    EBProcedureCodeComputedType:
      type: object
      properties:
        category:
          type: string
        category_service:
          type: string
        disclaimers:
          type: array
          items:
            type: string
        disclaimers_string:
